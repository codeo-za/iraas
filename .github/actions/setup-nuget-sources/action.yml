name: 'Setup NuGet Sources'
description: 'Configure NuGet sources for the project'

inputs:
  github-token:
    description: 'GitHub token for authentication'
    required: true
  github-username:
    description: 'GitHub username'
    required: true
  bust-cache:
    description: 'Set to true to bypass the NuGet cache'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: 📦 Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ inputs.bust-cache == 'true' && github.run_id || hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Add NuGet sources
      shell: bash
      env:
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
      run: |
        dotnet nuget add source --name github-codeo --username '${{ inputs.github-username }}' --password '${{ inputs.github-token }}' --store-password-in-clear-text https://nuget.pkg.github.com/codeo-za/index.json
        dotnet nuget add source $GITHUB_WORKSPACE/packages -n LocalPackages 
    